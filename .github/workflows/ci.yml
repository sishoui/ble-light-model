name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:logic
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  logic-test:
    name: logic-test (layer 1 Node)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:logic
      - run: npm run vitest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-test-junit
          path: artifacts/
          retention-days: 14

  firmware-host-test:
    name: firmware-host-test (layer 1 C core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -U platformio
      # --require-host：缺 PlatformIO 时判红而非静默跳过（层 1 C host 单测是必绿项）
      - run: npm run test:host -- --require-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-results
          path: artifacts/
          retention-days: 14

  protocol-vectors:
    name: protocol-vectors (layer 3)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: npm ci
      - run: npm run build:logic
      - run: npm run protocol-vectors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-vectors-report
          path: artifacts/
          retention-days: 14

  site-build:
    name: site-build (project site)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [logic-test, firmware-host-test, protocol-vectors]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4