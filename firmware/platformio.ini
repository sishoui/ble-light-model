; PlatformIO 工程（ESP-IDF v5.5.3 + ESP32-C3FH4）
; 工具链版本锁定见 CI 与本地 pio update。目录分层见 docs/spec/driver.md §5.1。
;
; env 约定：
;   esp32c3   —— 目标固件（8×100 WS2812B，2×RMT 4+4 分时复用）
;   native    —— host 单测（firmware/{effects,driver,proto} 的 C core，Unity），无需硬件
;
; 硬约束（docs/spec/driver.md §0.3 / §4）：
;   CONFIG_RMT_TX_ISR_CACHE_SAFE=y 必须开；intr_priority = 3；CONFIG_PM_ENABLE=n。

[platformio]
default_envs = esp32c3
monitor_speed = 115200

[env:esp32c3]
platform = espressif32@6.9.0
framework = espidf
board = esp32-c3-devkitm-1
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
  -D CONFIG_RMT_TX_ISR_CACHE_SAFE=y
  -D CONFIG_PM_ENABLE=n
; intr_priority 在 IDF 组件 sdkconfig 侧设置（rmt_tx_intr_priority）

[env:native]
platform = native
test_framework = unity
; host 单测：firmware/{effects,driver,proto} 的 C99 core 同源编译（无 IDF）。
; 把 effects/driver/proto 各自当作 PIO "library"（include/ + src/ 布局）引入：
;   lib_extra_dirs 让它们的 src/*.c 进编译、include/ 进头文件搜索；
;   lib_ldf_mode = chain 确保被 test/*.c 包含的头会触发对应库编译。
; 本票（#33）只落地 effects；driver/proto 由 #35/#36 补充到 lib_extra_dirs。
lib_extra_dirs =
  effects
  proto
lib_ldf_mode = chain
build_flags =
  -D LIGHT_TELEMETRY
; 用例放 firmware/test/，见 docs/spec/driver.md §7