; BLE Light Model 固件工程骨架。
; 协议层（proto/）是纯 C99，可 host 编译；esp32-c3 使用 ESP-IDF v5.5.3。
; espressif32 6.13.0 解析到 framework-espidf 3.50503.0（ESP-IDF v5.5.3）。

[platformio]
default_envs = native
src_dir = src
test_dir = test

[env:native]
platform = native
build_src_filter = +<*> +<../proto/*.c>
build_flags =
    -std=c99
    -Wall
    -Wextra
    -Werror
    -Iproto
test_build_src = true

[env:esp32-c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf
build_flags =
    -Wall
    -Wextra
    -Iproto
monitor_speed = 115200