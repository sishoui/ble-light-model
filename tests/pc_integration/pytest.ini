# PC 集成测试（#15）
#
# 三层：
# - 协议 golden 向量（tests/protocol/vectors.json）：无硬件，默认跑。
# - harness 逻辑 fake 测试：无硬件，默认跑。
# - 真 C3 集成（@pytest.mark.hardware）：默认不跑（需要 BLE 适配器 + C3）。
#
# 用法（本目录下，.venv 已激活或 python -m pytest）：
#   pytest                          # 默认：非 hardware 项全跑
#   pytest -m hardware              # 真机全量（连接/写/ACK/STATUS/断连重连）
#   pytest -m smoke                 # 真机冒烟子集（<1min 口径的用例）
#   python smoke.py                 # 独立 <1min 冒烟脚本
#
# 不进 CI：依赖物理硬件（spec §2）。

[pytest]
testpaths = .
addopts = -m "not hardware"
markers =
    hardware: 需要真 C3 + PC BLE 适配器（默认不跑，pytest -m hardware 手动触发）
    smoke: <1min 冒烟子集（真机）